services:
  postgres:
    image: postgres:16
    container_name: islamicai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-islamicai}
      POSTGRES_USER: ${POSTGRES_USER:-islamicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/storage/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: islamicai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: islamicai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_too}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/storage/minio:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: islamicai_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./data/storage/qdrant:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: islamicai_neo4j
    environment:
      NEO4J_AUTH: neo4j/change_me
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./data/storage/neo4j:/data
    restart: unless-stopped

  api:
    image: python:3.12-slim
    container_name: islamicai_api
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-islamicai}
      POSTGRES_USER: ${POSTGRES_USER:-islamicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    command: bash -lc "python -m pip install -e . && uvicorn apps.api.app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
      - neo4j
    restart: unless-stopped
